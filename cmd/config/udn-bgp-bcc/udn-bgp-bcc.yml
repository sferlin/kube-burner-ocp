# BGP Cloud Connector variant of the UDN-BGP workload.
---
global:
  gc: {{.GC}}
  gcMetrics: {{.GC_METRICS}}
  measurements:
    - name: raLatencyBCC
metricsEndpoints:
{{ if .ES_SERVER }}
  - metrics: [{{.METRICS}}]
    alerts: [{{.ALERTS}}]
    indexer:
      esServers: ["{{.ES_SERVER}}"]
      insecureSkipVerify: true
      defaultIndex: {{.ES_INDEX}}
      type: opensearch
{{ end }}
{{ if .LOCAL_INDEXING }}
  - metrics: [{{.METRICS}}]
    alerts: [{{.ALERTS}}]
    indexer:
      type: local
      metricsDirectory: collected-metrics-{{.UUID}}
{{ end }}
jobs:
  - name: udn-bgp-bcc-create-namespaces
    jobIterations: {{.JOB_ITERATIONS}}
    qps: {{.QPS}}
    burst: {{.BURST}}
    namespacedIterations: false
    waitWhenFinished: true
    skipIndexing: true
    jobPause: 30s
    cleanup: false
    objects:
      - objectTemplate: namespace.yml
        replicas: 1
        inputVars:
          namespaces_per_cudn: {{.NAMESPACES_PER_CUDN}}
      - objectTemplate: configmap.yml
        replicas: 1

  - name: udn-bgp-bcc-create-bgp-routing
    {{- $numCudn := div .JOB_ITERATIONS .NAMESPACES_PER_CUDN }}
    jobIterations: {{$numCudn}}
    qps: {{.QPS}}
    burst: {{.BURST}}
    namespacedIterations: false
    waitWhenFinished: true
    cleanup: false
    objects:
      - objectTemplate: bgprouting.yml
        replicas: 1
        inputVars:
          maxTimeout: 10m
          awsRegion: {{.AWS_REGION}}
          routeServerId: {{.ROUTE_SERVER_ID}}
          cidrs_per_cudn: {{.CIDRS_PER_CUDN}}
